{% extends "base.html" %}
{% from "_macros.html" import form_errors %}

{% block title %}Login — {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header bg-brand text-white text-center">
                <h4 class="mb-0">Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    {{ form_errors(errors) }}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username"
                               value="{{ username or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        <div class="custom-control custom-checkbox mt-1">
                            <input type="checkbox" class="custom-control-input" id="show-password"
                                   onclick="document.getElementById('password').type = this.checked ? 'text' : 'password'">
                            <label class="custom-control-label small" for="show-password">Show password</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
            </div>
        </div>
        {% if not is_logged_in %}
        <p class="text-center text-muted mt-3">
            Don't have access? Contact your administrator.
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
