{% from "_macros.html" import csrf %}
{% if request.args.get('undo') %}
<div class="alert alert-warning d-flex flex-wrap justify-content-between align-items-center" role="status">
    <span class="mr-3">Deleted. Changed your mind?</span>
    <form method="post" action="{{ url_for('undo.undo_delete', token=request.args.get('undo')|int) }}" class="mb-0">
        {{ csrf() }}
        <input type="hidden" name="kind" value="{{ undo_kind|default('') }}">
        <button type="submit" class="btn btn-sm btn-dark">Undo delete</button>
    </form>
</div>
{% endif %}
