<tr id="sub-{{ s.id }}">
    <td>
        <strong>{{ s.name }}</strong>
        {% if s.notes %}<br><small class="text-muted">{{ s.notes }}</small>{% endif %}
    </td>
    <td>${{ "%.2f"|format(s.amount) }}</td>
    <td>{{ format_frequency(s.frequency) }}</td>
    <td>{{ s.next_due }}</td>
    <td class="text-right">
        <form method="post" action="{{ url_for('subscriptions.subscription_mark_paid', sub_id=s.id) }}" class="d-inline"
              hx-post="{{ url_for('subscriptions.subscription_mark_paid', sub_id=s.id) }}"
              hx-target="#sub-{{ s.id }}"
              hx-swap="outerHTML">
            {{ csrf() }}
            <button type="submit" class="btn btn-sm btn-outline-success" title="Mark paid & advance">Mark paid</button>
        </form>
        <a href="{{ url_for('subscriptions.subscription_edit', sub_id=s.id) }}" class="btn btn-sm btn-outline-primary">Edit</a>
        <form method="post" action="{{ url_for('subscriptions.subscription_toggle', sub_id=s.id) }}" class="d-inline"
              hx-post="{{ url_for('subscriptions.subscription_toggle', sub_id=s.id) }}"
              hx-target="#sub-{{ s.id }}"
              hx-swap="outerHTML">
            {{ csrf() }}
            <button type="submit" class="btn btn-sm btn-outline-warning">Pause</button>
        </form>
        <a href="#" class="btn btn-sm btn-outline-danger ml-1"
           hx-post="{{ url_for('subscriptions.subscription_delete', sub_id=s.id) }}"
           hx-target="#sub-{{ s.id }}"
           hx-swap="outerHTML"
           hx-confirm="Delete this subscription?"
           title="Delete this subscription">Delete</a>
    </td>
</tr>
