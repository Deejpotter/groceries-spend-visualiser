services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grocery-visualiser
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - PORT=${PORT:-5000}
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATABASE_PATH=/app/data/groceries.db
    volumes:
      # Named volume keeps the image's appuser ownership of /app/data (a host bind
      # mount is often root-owned, which stops the non-root app creating the DB).
      - grocery-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  grocery-data:
