name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grocery-visualiser:ci
          # Reuse unchanged layers (apt, pip install) from earlier runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test public pages
        run: |
          docker run -d --name app -p 5000:5000 -e SECRET_KEY=ci grocery-visualiser:ci
          for i in $(seq 1 20); do curl -fs http://localhost:5000/health && break; sleep 1; done
          curl -fs http://localhost:5000/health
          curl -fsL http://localhost:5000/login | grep -q "Larder"  # base template renders (setup page on a fresh DB)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/)" = "302"  # dashboard redirects when logged out
          docker logs app 2>&1 | grep -qi "traceback" && { docker logs app; exit 1; } || true
