name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grocery-visualiser:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 5000:5000 -e SECRET_KEY=ci grocery-visualiser:ci
          for i in $(seq 1 20); do curl -fs http://localhost:5000/health && exit 0; sleep 1; done
          docker logs app; exit 1
